# Logrotate untuk log backup & retensi PostgreSQL (dijalankan cron user rania).
# Pasang dengan: sudo install -m 644 scripts/logrotate-pg-backup.conf /etc/logrotate.d/sentient-factory-pg-backup
#
# copytruncate dipakai karena cron menulis log via redirect '>>' (tidak ada proses
# yang bisa di-sign untuk reopen). weekly x rotate 4 = simpan ~1 bulan riwayat.

/opt/sentient-factory/backups/postgres/backup.log
/opt/sentient-factory/backups/postgres/retention-gfs.log {
    su rania rania
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

  #root { height: 100vh; }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="AdminLayanan.jsx"></script>

<script type="text/babel" src="BookingWizard.jsx"></script>

<script type="text/babel" src="AdminDialogs3.jsx"></script>
<script type="text/babel" src="MobileExtra.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

function Phone({ children }) {
  return (
    <IOSDevice>
      <div style={{ height: '100%', overflow: 'hidden', borderRadius: 50 }}>
        {children}
      </div>
    </IOSDevice>
  );
}

function App() {

        <DCArtboard id="menu-per-row" label="Menu navigasi · per-baris ke semua artboard" width={1100} height={880}>
          <MenuPerRow />
        </DCArtboard>
      </DCSection>

      {/* === ADMIN · OPERASIONAL === */}

      <DCSection id="page-penjadwalan" title="Penjadwalan" subtitle="Default view + wizard klien baru + detail booking + reschedule + cancel">
        <DCArtboard id="admin-schedule" label="Default · Jadwal harian" width={1280} height={880}>
          <DesktopAdmin />
        </DCArtboard>

          <BookingWizard />
        </DCArtboard>
        <DCArtboard id="dlg-booking-detail" label="State · Klik booking → detail sesi" width={760} height={820}>

        </DCArtboard>

          <DialogSortir />
        </DCArtboard>

          <DialogAddKlien />
        </DCArtboard>
      </DCSection>

          <AdminRooms />
        </DCArtboard>
        <DCArtboard id="dlg-add-ruangan" label="State · Tambah ruangan" width={660} height={820}>
          <DialogAddRuangan />
        </DCArtboard>
      </DCSection>

      <DCSection id="page-psikolog" title="Psikolog" subtitle="Tim & profil + form tambah psikolog">
        <DCArtboard id="admin-psikolog" label="Default · Tim & profil" width={1280} height={880}>
          <AdminPsikolog />
        </DCArtboard>
        <DCArtboard id="dlg-add-psikolog" label="State · Tambah psikolog" width={760} height={820}>

          <DialogAddLayanan />
        </DCArtboard>

          <OwnerDashboard />
        </DCArtboard>

          <Phone><MobileAdminRooms /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="page-ma-notif" title="Mobile Admin · Notifikasi WA" subtitle="Log & template WA di mobile">
        <DCArtboard id="ma-notif" label="Default · Log & template" width={390} height={844}>
          <Phone><MobileAdminNotifWA /></Phone>
        </DCArtboard>
      </DCSection>

      {/* === MOBILE · STAFF PSIKOLOG === */}

      <DCSection id="page-mp-today" title="Mobile Psikolog · Hari ini" subtitle="Landing — sesi hari ini">
        <DCArtboard id="m-today" label="Default · Hari ini" width={390} height={844}>

      <DCSection id="page-mp-klien" title="Mobile Psikolog · Klien saya" subtitle="Daftar klien yang ditangani (v2 · search + state + BR-04 banner)">

          <Phone><MobilePsikologKlien /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="page-mp-jadwal" title="Mobile Psikolog · Jadwal mingguan" subtitle="View jadwal mingguan untuk staff psikolog di mobile">

          <Phone><MobilePsikologJadwal /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="page-mp-detail" title="Mobile Psikolog · Detail klien & catatan" subtitle="Profil klien + catatan klinis ringkas">
        <DCArtboard id="mp-detail" label="Default · Detail klien & catatan" width={390} height={844}>
          <Phone><MobilePsikologDetail /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="page-mp-availability" title="Mobile Psikolog · Availability" subtitle="Atur jam available mingguan">
        <DCArtboard id="m-availability" label="Default · Availability mingguan" width={390} height={844}>

        </DCArtboard>

      <DCSection id="page-mp-profil" title="Mobile Psikolog · Profil saya" subtitle="Profil pribadi staff psikolog">

</script>

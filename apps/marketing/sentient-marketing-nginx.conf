server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
  }

  location = /login {
    return 302 https://sentient.fr-labs.my.id;
  }

  location /media/ {
    try_files $uri =404;
  }

  location /og/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

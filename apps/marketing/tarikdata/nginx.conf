server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # style-src izinkan inline: halaman memakai <style> per-halaman dan atribut style.
  # script-src izinkan inline demi blok <script type="application/ld+json">; skrip
  # dari origin lain tetap ditolak dan tidak ada handler on* di markup.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  error_page 404 /404.html;

  # Catatan: add_header di dalam location membatalkan seluruh add_header level
  # server. Cache diatur lewat `expires`, yang tidak memutus pewarisan itu.
  location = /404.html {
    internal;
    expires -1;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
  }

  # Nama berkas aset tidak ber-hash, jadi cache pendek + revalidasi wajib.
  location /assets/ {
    try_files $uri =404;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ =404;
    expires 5m;
  }
}

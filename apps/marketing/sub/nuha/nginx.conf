server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Prototype claude.ai/design: support.js meng-compile markup <x-dc> saat runtime
  # lewat new Function(), jadi 'unsafe-eval' + 'unsafe-inline' wajib. Skrip dari
  # origin lain tetap ditolak. Font dari Google Fonts (dipakai halaman).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  # Nama berkas aset tidak ber-hash, jadi cache pendek + revalidasi wajib.
  location /assets/ {
    try_files $uri =404;
    expires 1h;
  }

  location /_ds/ {
    try_files $uri =404;
    expires 1h;
  }

  # React + Babel UMD hasil vendoring; versinya dipin, jadi cache panjang aman.
  location /vendor/ {
    try_files $uri =404;
    expires 30d;
  }

  # SPA satu halaman: rute apa pun jatuh ke index.html.
  location / {
    try_files $uri $uri/ /index.html;
    expires 5m;
  }
}

services:
  vault:
    image: hashicorp/vault:1.16
    container_name: sentient-infra-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-change-me-local-only}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentient_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sentient-postgres-core
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3208:5432"
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentient-infra-redis
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3213:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    image: node:20-bullseye
    container_name: sentient-infra-api-gateway
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/api-gateway/.env.vault
    ports:
      - "3203:3203"
    environment:
      NODE_ENV: development
      PORT: 3203
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://root:PasswordSuperRahasia123!@postgres:5432/sentient_factory
      MYERPPLUS_DB_MAPPING_ROOT: /myerpplus-db-mapping/db
      DASHBOARD_SQL_TEMPLATE_ROOT: /myerpplus-db-mapping/dashboard-mapping/sql-templates
      HR_ATTENDANCE_STORAGE_PATH: /app/temp/hr-attendance
    volumes:
      - ../apps/api-gateway:/app
      - ../apps/myerpplus-db-mapping:/myerpplus-db-mapping:ro
      - ../temp/hr-attendance:/app/temp/hr-attendance
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install --include=dev && npx prisma generate && npm run dev"

  ai-engine:
    image: python:3.11-slim
    container_name: sentient-infra-ai-engine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: development
      PYTHONPATH: /app
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 3208
      POSTGRES_USER: root
      POSTGRES_DB: sentient_factory
      AI_AUDIT_DATABASE_URL: postgresql://root:PasswordSuperRahasia123!@host.docker.internal:3208/sentient_factory
      MYERPPLUS_DATABASE_URL: mysql+pymysql://dashboard:PwdDash)(*@103.125.36.54:20406/myerpplus_dashboard
      AI_ENGINE_HOST: 0.0.0.0
      AI_ENGINE_PORT: 8001
      AI_ENGINE_RELOAD: "true"
      CODEX_CONFIG_PATH: /codex-cli/config.toml
      AI_AGENT_WORKFLOW_MAX_PASSES: 2
      LLM_REQUEST_TIMEOUT_SECONDS: 120
      LLM_REQUEST_MAX_RETRIES: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../apps/ai-engine:/app:ro
      - ../apps/myerpplus-db-mapping:/myerpplus-db-mapping:ro
      - /home/rania/apps/sentient-factory/.codex-cli:/codex-cli:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      sh -c "export DEBIAN_FRONTEND=noninteractive &&
      apt-get update &&
      apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ind tesseract-ocr-eng poppler-utils &&
      rm -rf /var/lib/apt/lists/* &&
      export DATABASE_URL=\"postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}\" &&
      python -m pip install --no-cache-dir fastapi 'uvicorn[standard]' pydantic-settings httpx psycopg2-binary pymysql cryptography tomli redis pytesseract Pillow pypdf openpyxl python-docx pdf2image python-multipart &&
      python -c \"import multipart, pytesseract, pypdf, openpyxl, docx; print('verified:', multipart.__file__)\" &&
      if [ \"$${AI_ENGINE_RELOAD}\" = \"true\" ]; then
        python -m uvicorn sentient_factory_ai.main:app --host 0.0.0.0 --port 8001 --reload;
      else
        python -m uvicorn sentient_factory_ai.main:app --host 0.0.0.0 --port 8001;
      fi"

  web-dashboard:
    image: node:20-alpine
    container_name: sentient-infra-web-dashboard
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/web-dashboard/.env.vault
    ports:
      - "3201:3201"
    environment:
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3203
      AI_ENGINE_URL: http://ai-engine:8001
      NEXT_PUBLIC_API_URL: https://sentient.fr-labs.my.id
      NEXT_PUBLIC_WS_URL: wss://sentient.fr-labs.my.id
      NEXT_ALLOWED_DEV_ORIGINS: 192.168.1.17,192.168.1.17:3201,localhost,localhost:3201,127.0.0.1,127.0.0.1:3201,sentient.fr-labs.my.id,http://192.168.1.17,http://192.168.1.17:3201,http://localhost,http://localhost:3201,http://127.0.0.1,http://127.0.0.1:3201,https://sentient.fr-labs.my.id
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_POLLING: "false"
    volumes:
      - ../apps/web-dashboard:/app
      - web_dashboard_node_modules:/app/node_modules
      - web_dashboard_next_cache:/app/.next
    depends_on:
      - api-gateway
      - ai-engine
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3201/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    command: >
      sh -c "if [ ! -f node_modules/.package-lock.stamp ] || ! cmp -s package-lock.json node_modules/.package-lock.stamp; then
        npm install --include=dev &&
        cp package-lock.json node_modules/.package-lock.stamp;
      fi &&
      npm run dev -- -H 0.0.0.0 -p 3201"

  docs:
    image: node:20-alpine
    container_name: sentient-infra-docs
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3205:3205"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../docs:/app
      - docs_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3205/docs/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      sh -c "npm install &&
      if [ \"$${NODE_ENV}\" = \"production\" ]; then
        npm run build &&
        npm run serve -- --host 0.0.0.0 --port 3205;
      else
        npm run start -- --host 0.0.0.0 --port 3205;
      fi"

  hr-marketing:
    image: nginx:alpine
    container_name: sentient-infra-hr-marketing
    restart: unless-stopped
    ports:
      - "3209:80"
    volumes:
      - ../apps/marketing/hr-marketing.html:/tmp/hr-marketing-source.html:ro
      - ../apps/web-dashboard/public/media/app/favicon.ico:/tmp/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      /bin/sh -c "mkdir -p /usr/share/nginx/html/media/app &&
      sync_assets() {
        awk 'found || /^<!DOCTYPE html>/{found=1; print}' /tmp/hr-marketing-source.html > /usr/share/nginx/html/index.html.tmp &&
        mv /usr/share/nginx/html/index.html.tmp /usr/share/nginx/html/index.html &&
        cp /tmp/favicon.ico /usr/share/nginx/html/media/app/favicon.ico;
      } &&
      sync_assets &&
      (
        last_state='' ;
        while true; do
          next_state=\"$$(stat -c '%Y:%s' /tmp/hr-marketing-source.html /tmp/favicon.ico 2>/dev/null | tr '\n' '|')\" ;
          if [ \"$$next_state\" != \"$$last_state\" ]; then
            sync_assets ;
            last_state=\"$$next_state\" ;
          fi ;
          sleep 1 ;
        done
      ) &
      exec nginx -g 'daemon off;'"

  sentient-marketing:
    image: nginx:alpine
    container_name: sentient-infra-sentient-marketing
    restart: unless-stopped
    ports:
      - "3210:80"
    volumes:
      - ../apps/marketing/sentient-marketing.html:/tmp/sentient-marketing-source.html:ro
      - ../apps/marketing/sentient-marketing-robots.txt:/tmp/robots.txt:ro
      - ../apps/marketing/sentient-marketing-sitemap.xml:/tmp/sitemap.xml:ro
      - ../apps/marketing/sentient-factory-og.svg:/tmp/og-image.svg:ro
      - ../apps/web-dashboard/public/media/app/favicon.ico:/tmp/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      /bin/sh -c "mkdir -p /usr/share/nginx/html/media/app /usr/share/nginx/html/og &&
      sync_assets() {
        awk 'found || /^<!DOCTYPE html>/{found=1; print}' /tmp/sentient-marketing-source.html > /usr/share/nginx/html/index.html.tmp &&
        mv /usr/share/nginx/html/index.html.tmp /usr/share/nginx/html/index.html &&
        cp /tmp/favicon.ico /usr/share/nginx/html/media/app/favicon.ico &&
        cp /tmp/robots.txt /usr/share/nginx/html/robots.txt &&
        cp /tmp/sitemap.xml /usr/share/nginx/html/sitemap.xml &&
        cp /tmp/og-image.svg /usr/share/nginx/html/og/sentient-factory-og.svg;
      } &&
      sync_assets &&
      (
        last_state='' ;
        while true; do
          next_state=\"$$(stat -c '%Y:%s' /tmp/sentient-marketing-source.html /tmp/favicon.ico /tmp/robots.txt /tmp/sitemap.xml /tmp/og-image.svg 2>/dev/null | tr '\n' '|')\" ;
          if [ \"$$next_state\" != \"$$last_state\" ]; then
            sync_assets ;
            last_state=\"$$next_state\" ;
          fi ;
          sleep 1 ;
        done
      ) &
      exec nginx -g 'daemon off;'"

  tarik-data-digital:
    image: nginx:alpine
    container_name: sentient-infra-tarik-data-digital
    restart: unless-stopped
    ports:
      - "3211:80"
    volumes:
      - ../apps/marketing/tarik-data-digital.html:/tmp/tarik-data-digital-source.html:ro
      - ../apps/marketing/tarik-data-digital-robots.txt:/tmp/robots.txt:ro
      - ../apps/marketing/tarik-data-digital-sitemap.xml:/tmp/sitemap.xml:ro
      - ../apps/marketing/tarik-data-digital-og.svg:/tmp/og-image.svg:ro
      - ../apps/web-dashboard/public/media/app/favicon.ico:/tmp/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      /bin/sh -c "mkdir -p /usr/share/nginx/html/media/app /usr/share/nginx/html/og &&
      sync_assets() {
        awk 'found || /^<!DOCTYPE html>/{found=1; print}' /tmp/tarik-data-digital-source.html > /usr/share/nginx/html/index.html.tmp &&
        mv /usr/share/nginx/html/index.html.tmp /usr/share/nginx/html/index.html &&
        cp /tmp/favicon.ico /usr/share/nginx/html/media/app/favicon.ico &&
        cp /tmp/robots.txt /usr/share/nginx/html/robots.txt &&
        cp /tmp/sitemap.xml /usr/share/nginx/html/sitemap.xml &&
        cp /tmp/og-image.svg /usr/share/nginx/html/og/tarik-data-digital-og.svg;
      } &&
      sync_assets &&
      (
        last_state='' ;
        while true; do
          next_state=\"$$(stat -c '%Y:%s' /tmp/tarik-data-digital-source.html /tmp/favicon.ico /tmp/robots.txt /tmp/sitemap.xml /tmp/og-image.svg 2>/dev/null | tr '\n' '|')\" ;
          if [ \"$$next_state\" != \"$$last_state\" ]; then
            sync_assets ;
            last_state=\"$$next_state\" ;
          fi ;
          sleep 1 ;
        done
      ) &
      exec nginx -g 'daemon off;'"

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentient-infra-kafka-ui
    restart: unless-stopped
    ports:
      - "3212:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentient-factory
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
    depends_on:
      kafka:
        condition: service_healthy

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: debezium-connect
    restart: unless-stopped
    env_file:
      - ./.env.vault.cdc
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sentient-factory-debezium-connect
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  etl-worker:
    image: node:20-bullseye
    container_name: sentient-infra-etl-worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/etl-worker/.env.vault
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/etl-worker:/app
      - etl_worker_node_modules:/app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"


volumes:
  mysql_data:
    external: true
    name: mysql_mysql_data
  postgres_data:
    name: sentient_factory_postgres_data
  redis_data:
    name: sentient_factory_redis_data
  api_gateway_node_modules:
    name: sentient_factory_api_gateway_node_modules
  web_dashboard_node_modules:
    name: sentient_factory_web_dashboard_node_modules
  web_dashboard_next_cache:
    name: sentient_factory_web_dashboard_next_cache
  docs_node_modules:
    name: sentient_factory_docs_node_modules
  etl_worker_node_modules:
    name: sentient_factory_etl_worker_node_modules

networks:
  default:
    external: true
    name: sentient_factory_isolated_net

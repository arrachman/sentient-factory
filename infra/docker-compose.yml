services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-PasswordSuperRahasia123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentient_db}
      MYSQL_USER: ${MYSQL_USER:-user_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-UserPassword123!}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sentient-postgres-core
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3208:5432"
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentient-infra-redis
    env_file:
      - ../.env
    ports:
      - "3209:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    image: node:20-bullseye
    container_name: sentient-infra-api-gateway
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "3203:3203"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3203
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npm run dev"

  web-dashboard:
    image: node:20-alpine
    container_name: sentient-infra-web-dashboard
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "3201:3201"
    environment:
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3203
      NEXT_PUBLIC_API_URL: https://sentient.fr-labs.my.id
      NEXT_PUBLIC_WS_URL: wss://sentient.fr-labs.my.id
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web-dashboard:/app
      - web_dashboard_node_modules:/app/node_modules
      - web_dashboard_next_cache:/app/.next
    depends_on:
      - api-gateway
    command: >
      sh -c "npm install --include=dev &&
      if [ \"$${NODE_ENV}\" = \"production\" ]; then
        npm run build &&
        mkdir -p .next/standalone/.next &&
        cp -r .next/static .next/standalone/.next/static &&
        cp -r public .next/standalone/public &&
        HOSTNAME=0.0.0.0 PORT=3201 node .next/standalone/server.js;
      else
        npm run dev -- -H 0.0.0.0 -p 3201;
      fi"

  docs:
    image: node:20-alpine
    container_name: sentient-infra-docs
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "3205:3205"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../docs:/app
      - docs_node_modules:/app/node_modules
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3205"

  llm-router:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: sentient-infra-llm-router
    env_file:
      - ../.env
    ports:
      - "3206:4000"
    volumes:
      - ../config/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]


volumes:
  mysql_data:
    external: true
    name: mysql_mysql_data
  postgres_data:
    name: sentient_factory_postgres_data
  redis_data:
    name: sentient_factory_redis_data
  api_gateway_node_modules:
    name: sentient_factory_api_gateway_node_modules
  web_dashboard_node_modules:
    name: sentient_factory_web_dashboard_node_modules
  web_dashboard_next_cache:
    name: sentient_factory_web_dashboard_next_cache
  docs_node_modules:
    name: sentient_factory_docs_node_modules

networks:
  default:
    external: true
    name: sentient_factory_isolated_net

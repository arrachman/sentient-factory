services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-core
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3308:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - ../.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    image: node:20-bullseye
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_GATEWAY_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_URL: ${REDIS_URL}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    volumes:
      - ../apps/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

  web-dashboard:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "${WEB_DASHBOARD_PORT}:${WEB_DASHBOARD_PORT}"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    volumes:
      - ../apps/web-dashboard:/app
      - web_dashboard_node_modules:/app/node_modules
      - web_dashboard_next_cache:/app/.next
    depends_on:
      - api-gateway
    command: sh -c "npm install --include=dev && npm run dev -- --webpack -H 0.0.0.0 -p ${WEB_DASHBOARD_PORT}"

  docs:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - ../.env
    ports:
      - "${DOCS_PORT}:${DOCS_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    volumes:
      - ../docs:/app
      - docs_node_modules:/app/node_modules
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port ${DOCS_PORT}"

volumes:
  postgres_data:
  redis_data:
  api_gateway_node_modules:
  web_dashboard_node_modules:
  web_dashboard_next_cache:
  docs_node_modules:

networks:
  default:
    name: sentient_factory_dev_net
    driver: bridge

services:
  vault:
    image: hashicorp/vault:1.16
    container_name: sentient-infra-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Set VAULT_DEV_ROOT_TOKEN_ID in your local shell or ignored env file}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: vault server -dev

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentient_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sentient-postgres-core
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3208:5432"
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentient-infra-redis
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3209:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    image: node:20-bullseye
    container_name: sentient-infra-api-gateway
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/api-gateway/.env.vault
    ports:
      - "3203:3203"
    environment:
      NODE_ENV: development
      PORT: 3203
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install --include=dev && npx prisma generate && npm run dev"

  ai-engine:
    image: python:3.11-slim
    container_name: sentient-infra-ai-engine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: development
      PYTHONPATH: /app
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 3208
      POSTGRES_USER: root
      POSTGRES_DB: sentient_factory
      AI_AUDIT_DATABASE_URL: postgresql://root:PasswordSuperRahasia123!@host.docker.internal:3208/sentient_factory
      MYERPPLUS_DATABASE_URL: mysql+pymysql://dashboard:PwdDash)(*@103.125.36.54:20406/myerpplus_dashboard
      AI_ENGINE_HOST: 0.0.0.0
      AI_ENGINE_PORT: 8001
      CODEX_CONFIG_PATH: /codex/config.toml
      AI_AGENT_WORKFLOW_MAX_PASSES: 2
      LLM_REQUEST_TIMEOUT_SECONDS: 120
      LLM_REQUEST_MAX_RETRIES: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../apps/ai-engine:/app:ro
      - ../apps/myerpplus-db-mapping:/myerpplus-db-mapping:ro
      - /home/rania/.codex:/codex:ro
    depends_on:
      postgres:
        condition: service_healthy
      llm-router:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\""]
      interval: 20s
      timeout: 10s
      retries: 5
    command: >
      sh -c "export DATABASE_URL=\"postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}\" &&
      pip install --no-cache-dir fastapi 'uvicorn[standard]' pydantic-settings httpx psycopg2-binary pymysql cryptography tomli redis &&
      python -m uvicorn sentient_factory_ai.main:app --host 0.0.0.0 --port 8001 --reload"

  web-dashboard:
    image: node:20-alpine
    container_name: sentient-infra-web-dashboard
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/web-dashboard/.env.vault
    ports:
      - "3201:3201"
    environment:
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3203
      AI_ENGINE_URL: http://ai-engine:8001
      NEXT_PUBLIC_API_URL: https://sentient.fr-labs.my.id
      NEXT_PUBLIC_WS_URL: wss://sentient.fr-labs.my.id
      NEXT_ALLOWED_DEV_ORIGINS: 192.168.1.17,192.168.1.17:3201,localhost,localhost:3201,127.0.0.1,127.0.0.1:3201,sentient.fr-labs.my.id,http://192.168.1.17,http://192.168.1.17:3201,http://localhost,http://localhost:3201,http://127.0.0.1,http://127.0.0.1:3201,https://sentient.fr-labs.my.id
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web-dashboard:/app
      - web_dashboard_node_modules:/app/node_modules
      - web_dashboard_next_cache:/app/.next
    depends_on:
      - api-gateway
      - ai-engine
    command: >
      sh -c "npm install --include=dev &&
      if [ \"$${NODE_ENV}\" = \"production\" ]; then
        npm run build &&
        mkdir -p .next/standalone/.next &&
        cp -r .next/static .next/standalone/.next/static &&
        cp -r public .next/standalone/public &&
        HOSTNAME=0.0.0.0 PORT=3201 node .next/standalone/server.js;
      else
        npm run dev -- -H 0.0.0.0 -p 3201;
      fi"

  docs:
    image: node:20-alpine
    container_name: sentient-infra-docs
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3205:3205"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../docs:/app
      - docs_node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
      if [ \"$${NODE_ENV}\" = \"production\" ]; then
        npm run build &&
        npm run serve -- --host 0.0.0.0 --port 3205;
      else
        npm run start -- --host 0.0.0.0 --port 3205;
      fi"

  llm-router:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: sentient-infra-llm-router
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.vault
    ports:
      - "3206:4000"
    volumes:
      - ../config/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentient-infra-kafka-ui
    restart: unless-stopped
    ports:
      - "3210:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentient-factory
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
    depends_on:
      kafka:
        condition: service_healthy

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: debezium-connect
    restart: unless-stopped
    env_file:
      - ./.env.vault.cdc
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sentient-factory-debezium-connect
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  etl-worker:
    image: node:20-bullseye
    container_name: sentient-infra-etl-worker
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
      - ../.env.vault
      - ../apps/etl-worker/.env.vault
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/etl-worker:/app
      - etl_worker_node_modules:/app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"


volumes:
  mysql_data:
    external: true
    name: mysql_mysql_data
  postgres_data:
    name: sentient_factory_postgres_data
  redis_data:
    name: sentient_factory_redis_data
  api_gateway_node_modules:
    name: sentient_factory_api_gateway_node_modules
  web_dashboard_node_modules:
    name: sentient_factory_web_dashboard_node_modules
  web_dashboard_next_cache:
    name: sentient_factory_web_dashboard_next_cache
  docs_node_modules:
    name: sentient_factory_docs_node_modules
  etl_worker_node_modules:
    name: sentient_factory_etl_worker_node_modules

networks:
  default:
    external: true
    name: sentient_factory_isolated_net

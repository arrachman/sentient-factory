# Portal dokumentasi Senti (Docusaurus multi-instance: HR/ERP/MDP + internal).
# Mengikuti pola reverse-proxy host yang sama dengan sentient.fr-labs.my.id.conf.
# Backend = `docusaurus serve` pada DOCS_PORT (config/ports.json → docs = 3205),
# dijalankan via: npm run docs:build && (cd docs && npm run serve -- --port 3205)
#
# Prasyarat (di luar repo):
#   - DNS A-record docs.fr-labs.my.id → IP host
#   - TLS (certbot/Let's Encrypt) — tambahkan blok 443 setelah sertifikat terbit
#   - UFW: port 80/443 sudah terbuka untuk proxy; 3205 cukup loopback (jangan expose)

upstream sentient_docs {
    server 127.0.0.1:3205;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.fr-labs.my.id;

    client_max_body_size 25m;

    location / {
        proxy_pass http://sentient_docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

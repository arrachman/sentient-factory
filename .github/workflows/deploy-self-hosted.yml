name: Deploy self-hosted

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated compose services to activate"
        required: false
        default: "web-dashboard"

concurrency:
  group: sentient-factory-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - sentient-factory

    steps:
      - name: Deploy on VPS
        env:
          DEPLOY_BEFORE: ${{ github.event.before }}
          DEPLOY_AFTER: ${{ github.event.after }}
        run: |
          services="${{ github.event.inputs.services }}"
          /opt/sentient-factory/scripts/deploy-self-hosted.sh $services

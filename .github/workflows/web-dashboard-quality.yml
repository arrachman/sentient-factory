name: web-dashboard-quality

on:
  pull_request:
    paths:
      - 'apps/web-dashboard/**'
      - '.github/workflows/web-dashboard-quality.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --force

      - name: Check
        run: npm run check
